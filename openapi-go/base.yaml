        in: path
        required: true
        schema:
          type: string
          description: BaseApp token
        description: BaseApp token
      - name: page_id
        in: path
        required: true
        schema:
          type: string
          description: BaseApp page ID
        description: BaseApp page ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: block name
                type:
